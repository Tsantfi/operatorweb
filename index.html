        <div class="card">

            <div class="card-content" id="el2">
                <input type="text" placeholder="nombre 1" id="soustr1"><br>
                <p style="font-weight: bold; text-align: center;">-</p>
                <input type="text" placeholder="nombre 2" id="soustr2"><br>

        </div>

        <div class="card">

                <input type="text" placeholder="nombre 1" id="divis1"><br>
                <p style="font-weight: bold; text-align: center;">/</p>
                <input type="text" placeholder="nombre 2" id="divis2"><br>
                <input type="submit" value="Réponse" onclick=divis()>
                <button type="button" onclick=eff3()>Effacer</button>
                <span id="sp2"></span>
            </div>
        </div>

        <div class="card">

            <div class="card-content" id="el4">
                <input type="text" placeholder="nombre 1" id="mdl1"><br>
                <p style="text-align: center;">%</p>
                <input type="text" placeholder="nombre 2" id="mdl2"><br>
                <input type="submit" value="Réponse" onclick=mod()>
                <button type="button" onclick=eff4()>Effacer</button>
                <span id="sp3"></span>
            </div>
        </div>

        <div class="card">
            <h1 class="t5">diviseur</h1>
            <div class="card-content" id="el5">
                <input type="text" placeholder="nombre 1" id="dvs1"><br>
                <input type="submit" value="Réponse" onclick=dvs_d()>
                <button type="button" onclick=eff5()>Effacer</button>
                <span id="sp4"></span>
            </div>
        </div>

        <div class="card">
            <h1 class="t5">Multiplication</h1>
            <div class="card-content" style="padding-left: 15px;" id="el5">
                <input type="text" placeholder="nombre 1" id="mtl1"><br>
                <p style="text-align: center;">X</p>
                <input type="text" placeholder="nombre 2" id="mtl2"><br>
                <input type="submit" value="Réponse" onclick=mtl()>
                <button type="button" onclick=eff6()>Effacer</button>
                <span id="sp5"></span>
            </div>
        </div>
    </div>
